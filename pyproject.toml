[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sseditor"
version = "0.1.0"
description = "Terminal editor for the DDSS clinical collections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyascii>=0.3.3",
    "citeproc-py[full]>=0.11",
    "pybtex>=0.26",
    "textual>=0.80",
    "titlecase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
sseditor = "editor.__main__:main"

[tool.setuptools.packages.find]
include = ["editor*"]

[tool.pytest.ini_options]
testpaths = ["editor/tests"]
# Coverage is reported for the `editor` package on every run. The `editor/tests`
# tree is measured but omitted from the report (see [tool.coverage.run]).
addopts = "--cov=editor --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["editor"]
omit = [
    "editor/tests/*",
]

[tool.coverage.report]
show_missing = true
# The unit-test suite must keep at least 95% line-and-branch coverage.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
